<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RouteDesk · 本地交互预览</title><link rel="icon" href="/icons/route.svg"><link rel="stylesheet" href="/preview/workbench.css"></head><body><header><a class="logo" href="/">RouteDesk <span>本地预览</span></a><p>修改前端文件后刷新预览，即可查看效果</p><button id="reload">刷新页面</button></header><div class="workbench"><aside><section><h2>显示设备</h2><div class="devices"><button data-device="desktop" aria-pressed="true">桌面</button><button data-device="mobile" aria-pressed="false">手机</button><button data-device="web" aria-pressed="false">网页</button></div><p id="dimensions">800 × 620</p></section><section><h2>交互场景</h2><label for="scenario">选择模拟状态</label><select id="scenario"><option value="routes">多线路 · 待连接</option><option value="empty">首次使用 · 无线路</option><option value="connected">已经连接</option><option value="verification">连接时需要验证码</option><option value="failure">连接时认证失败</option></select><p>选择场景会重置演示数据。验证码场景可输入任意非空内容。</p></section><section><h2>快速进入</h2><div class="shortcuts"><button data-route="home">首页</button><button data-route="connections">连接</button><button data-route="settings">设置</button><button data-route="settings/diagnostics">日志与诊断</button></div></section><div class="note">全部连接均为模拟。请勿输入真实账户或密码。关闭或刷新页面后，演示数据会重置。</div><a class="standalone" href="/app" target="_blank" rel="noopener">独立窗口打开界面 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a></aside><main class="stage" id="stage"><div id="device" class="desktop"><iframe id="preview" src="/app#home" title="RouteDesk 交互界面"></iframe></div><div class="stage-caption" id="caption">桌面 · 800 × 620</div></main></div><script type="module" src="/preview/workbench.mjs"></script></body></html>
