# Build separation and artifact aggregation follow EZ4Connect and jsgsMock release workflows.
name: CampusWay packages
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -timeout 180s
      - run: go vet ./...
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run github.com/akavel/rsrc@v0.10.2 -manifest gui/campusway.exe.manifest -ico build/assets/campusway.ico -o gui/rsrc_windows_amd64.syso
      - shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.2.0-alpha.1' }
          ./build.ps1 -GoBin go -Version $version
      - run: choco install nsis --no-progress -y
      - shell: pwsh
        run: |
          & 'C:/Program Files (x86)/NSIS/makensis.exe' build/windows.nsi
          if ($LASTEXITCODE) { throw 'Installer failed' }
          Move-Item build/CampusWay-Setup.exe dist/campusway/
      - uses: actions/upload-artifact@v4
        with:
          name: CampusWay-windows-x64
          path: dist/campusway/*
  unix:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: bash build/package-unix.sh '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: CampusWay-${{ matrix.platform }}
          path: dist/packages/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CampusWay-*
          merge-multiple: true
          path: packages
      - run: cd packages && sha256sum *.zip *.exe *.dmg *.tar.gz *.deb > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: packages/*
