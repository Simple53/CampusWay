name: Validate CampusWay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/check.ps1 -GoBin go
      - shell: pwsh
        run: |
          go run github.com/akavel/rsrc@v0.10.2 -manifest gui/campusway.exe.manifest -ico build/assets/campusway.ico -o gui/rsrc_windows_amd64.syso
          if ($LASTEXITCODE) { throw 'Resource generation failed' }
          ./build.ps1 -GoBin go
          python build/smoke.py
          if ($LASTEXITCODE) { throw 'Worker smoke test failed' }
